name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SpacetimeDB CLI
        run: |
          curl -sSfL https://install.spacetimedb.com | bash -s -- --yes
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build & Publish SpacetimeDB Module
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd spacetime-module
          spacetime build
          spacetime publish --yes blue-marble-front

      - name: Generate TypeScript Bindings
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p client/src/generated
          spacetime generate --lang typescript --out-dir client/src/generated --module-path ./spacetime-module

      - name: Build Client
        run: |
          cd client
          npm install
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
